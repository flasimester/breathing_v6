<style>
:root{--bg:#000;--surface:#0A0A0A;--line:#232323;--text:#EDEDEA;--muted:#8B8F92;--accent:#B5602E;--warn:#C9483A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{height:100%;}
*{box-sizing:border-box;}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0 0 .3em;font-weight:600;letter-spacing:-.01em;}
p{margin:.4em 0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.hero{padding:18px 20px;border-bottom:1px solid var(--line);}
.hero-inner,.wrap{max-width:680px;margin:0 auto;}
.hero-inner{position:relative;}
.lang{position:absolute;top:0;right:0;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.lang button{font:inherit;font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--muted);background:none;border:0;padding:7px 11px;cursor:pointer;}
.lang button.on{background:var(--accent);color:#fff;}
.eyebrow{color:var(--accent);font-size:.78rem;font-weight:600;}
.hero h1{font-size:1.6rem;margin-top:4px;}
.hero p{color:var(--muted);font-size:.92rem;}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5;}
.tabs{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{font:inherit;font-size:.74rem;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:14px 3px;cursor:pointer;white-space:nowrap;flex:1 0 auto;min-width:38px;}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
.wrap{padding:0 20px 60px;}
section{padding:26px 0;display:none;}
section.active{display:block;}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.label{color:var(--accent);font-size:.8rem;font-weight:600;}
.badge{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px;}
.title{font-size:1.25rem;margin-top:2px;}
.focus{color:var(--muted);font-size:.93rem;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0 4px;}
td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
td.chk{width:30px;padding-left:0;}
td.gt{width:1%;padding-right:0;vertical-align:top;padding-top:10px;}
td .n{font-weight:500;}
td .f{color:var(--muted);font-size:.8rem;margin-top:2px;}
td .d{color:var(--muted);font-size:.86rem;margin-top:3px;}
tr{cursor:pointer;}
tr:active{background:var(--surface);}
tr.done .n,tr.done .d{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
.go{font:inherit;font-size:.78rem;font-weight:500;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:4px;padding:7px 11px;cursor:pointer;white-space:nowrap;}
.go:active{background:var(--accent);color:#fff;}
.opt .go{margin-top:10px;display:block;}
.ib{position:relative;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:600;font-size:.72rem;line-height:1;width:20px;height:20px;padding:0;margin-left:7px;vertical-align:1px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);background:none;cursor:pointer;}
.ib::after{content:"";position:absolute;inset:-10px;}
.ib[aria-expanded=true]{color:var(--accent);border-color:var(--accent);}
.inf{margin-top:10px;padding:10px 12px;background:var(--surface);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;font-size:.84rem;color:var(--muted);animation:op .2s ease;}
.inf[hidden]{display:none;}
.inf p{margin:.35em 0;}
.inf b{color:var(--text);font-weight:600;}
@keyframes op{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
#s0 .label{text-transform:uppercase;}
.reset.red{border-color:var(--warn);color:var(--warn);}
.dt{border:1px solid var(--line);border-radius:6px;margin:10px 0;background:var(--surface);}
.dt summary{cursor:pointer;padding:13px 14px;font-weight:500;font-size:.92rem;list-style:none;display:flex;align-items:center;gap:8px;}
.dt summary::-webkit-details-marker{display:none;}
.dt summary>span:first-child{flex:1;}
.dt summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1;}
.dt[open] summary::after{content:"–";}
.dt .cnt{color:var(--muted);font-weight:400;font-size:.8rem;}
.dt ul{margin:0;padding:0 16px 14px 32px;}
.dt li{margin:.55em 0;font-size:.88rem;color:var(--muted);}
.pack{padding:0 14px 8px;}
.pk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem;cursor:pointer;}
.pk input{margin-top:3px;flex:none;}
.pri{font:inherit;font-size:.88rem;font-weight:600;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;cursor:pointer;}
.lk{font:inherit;font-size:.86rem;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px;}
select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color-scheme:dark;max-width:100%;min-width:0;}
.ar{padding:12px 0;border-bottom:1px solid var(--line);}
.ar .note{padding-top:6px;font-size:.82rem;}
.seg2{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg2 button{flex:1;font:inherit;font-size:.84rem;color:var(--muted);background:none;border:0;padding:9px 6px;cursor:pointer;}
.seg2 button.on{background:var(--accent);color:#fff;}
.adj,.nudge{background:var(--surface);}
.alert{border:1px solid var(--warn);border-radius:6px;padding:14px 16px;margin:14px 0 8px;}
.alert h3{color:var(--warn);font-size:1rem;margin:0 0 6px;}
.alert p{margin:.45em 0;font-size:.9rem;}
.alert .fine{color:var(--muted);font-size:.8rem;}
.tool{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);}
.tool .tl{flex:1;min-width:0;}
.tool .n{font-weight:500;font-size:.92rem;}
.tool .f{color:var(--muted);font-size:.8rem;margin-top:2px;}
.tool .d{color:var(--muted);font-size:.86rem;margin-top:3px;}
.tool .go{margin-top:2px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 8px;}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px 6px;text-align:center;}
.stat b{display:block;font-size:1.5rem;font-weight:600;line-height:1.2;}
.stat span{color:var(--muted);font-size:.72rem;}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;}
.dot{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);}
.dot.on{background:var(--accent);border-color:var(--accent);}
.dot.t{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--muted);}
.fine{color:var(--muted);font-size:.8rem;}
.wr{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.84rem;}
.wr .bar{flex:1;margin:0;}
.wr .wn{color:var(--muted);min-width:46px;text-align:right;}
.hr{padding:9px 0;border-bottom:1px solid var(--line);}
.hr .n{font-weight:500;font-size:.88rem;}
.hr .f{color:var(--muted);font-size:.82rem;margin-top:2px;}
.tw{overflow-x:auto;}
.bt{width:100%;border-collapse:collapse;font-size:.84rem;margin:10px 0;}
.bt tr{cursor:default;}
.bt th{color:var(--muted);font-weight:500;text-align:center;padding:6px 4px;font-size:.76rem;}
.bt th:first-child,.bt td:first-child{text-align:left;}
.bt th small{display:block;font-weight:400;}
.bt td{padding:9px 4px;text-align:center;min-width:52px;}
.bt td:first-child{min-width:0;}
.fr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
input[type=number],input[type=time]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color-scheme:dark;width:110px;max-width:100%;min-width:0;min-height:40px;-webkit-appearance:none;appearance:none;}
.nt{color:var(--muted);font-size:.78rem;margin:-6px 0 12px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion:reduce){.orb,.arc{transition:none!important;}.inf{animation:none;}}
.card{border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:10px;}
.dl{display:block;color:var(--muted);font-size:.8rem;margin-bottom:6px;}
input[type=date]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color-scheme:dark;display:block;width:100%;min-width:0;max-width:100%;min-height:44px;-webkit-appearance:none;appearance:none;text-align:left;}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0;}
input[type=date]::-webkit-datetime-edit{padding:0;}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btns .reset{margin-top:0;}
.go.big{font-size:.95rem;font-weight:600;padding:13px 18px;background:var(--accent);color:#fff;border-color:var(--accent);width:100%;}
.btns .go.big{width:auto;}
.wk{display:flex;justify-content:space-between;margin:16px 0 6px;}
.wd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--muted);}
.wd.future{opacity:.55;}.wd.rest{border-style:dashed;opacity:.5;}.wd.part{border-color:var(--accent);color:var(--text);}.wd.missed{border-color:var(--muted);color:var(--text);}
.wd.full{background:var(--accent);border-color:var(--accent);color:#fff;}
.wd.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text);}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 6px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);}
.pg{color:var(--muted);font-size:.84rem;}
.nx{margin:16px 0 4px;}
.sub{font-size:.95rem;margin:22px 0 4px;}
.srow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.srow .sm{flex:1;min-width:0;}
.srow .n{font-weight:500;font-size:.9rem;}
.srow .f{color:var(--muted);font-size:.8rem;margin-top:2px;}
.srow.done .n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
.srow input{margin-top:3px;}
.note{color:var(--muted);font-size:.9rem;padding:12px 0 0;margin:0;}
.ok{border-left:2px solid var(--accent);padding:8px 0 8px 14px;margin:14px 0;font-size:.9rem;}
.why{border-left:2px solid var(--accent);padding:8px 0 8px 14px;margin-top:14px;font-size:.88rem;color:var(--muted);}
.why b{color:var(--text);}
.opt{border:1px dashed var(--line);border-radius:6px;padding:12px 14px;margin-top:14px;font-size:.88rem;color:var(--muted);}
.opt b{color:var(--text);}
.notes{border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:8px;}
.notes h3{font-size:1rem;color:var(--accent);}
.notes.warn h3{color:var(--warn);}
.notes ul{margin:.4em 0 1em;padding-left:1.1em;}
.notes li{margin:.45em 0;font-size:.92rem;}
.reset{font:inherit;font-size:.83rem;color:var(--muted);background:none;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:8px 14px;margin-top:10px;}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding:24px 20px 10px;}

/* ---- guided timer overlay ---- */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
 padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));}
.ov[hidden]{display:none;}
.ovb{width:100%;max-width:420px;text-align:center;margin:auto;}
.ot{font-size:1.15rem;font-weight:600;padding:0 40px;}
.od{color:var(--muted);font-size:.86rem;margin:6px 0 14px;}
.xb,.sb{position:fixed;z-index:2;background:var(--bg);top:max(12px,env(safe-area-inset-top,0px));font:inherit;background:none;border:1px solid var(--line);color:var(--muted);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;}
.xb{right:14px;}.sb{left:14px;font-size:.9rem;}
.sb.off{opacity:.45;text-decoration:line-through;}
.opts{display:flex;gap:8px;justify-content:center;margin-bottom:6px;min-height:0;}
.opts button{font:inherit;font-size:.85rem;color:var(--muted);background:none;border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.opts button.on{color:var(--text);border-color:var(--accent);}
.ring{position:relative;width:min(78vw,300px,40dvh);aspect-ratio:1;margin:10px auto;}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.ring .bg{stroke:var(--line);}
.ring .arc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear;}
.orb{position:absolute;inset:9%;border-radius:50%;background:rgba(181,96,46,.2);border:1px solid var(--accent);transform:scale(.55);}
.noorb .orb{display:none;}
.ov[data-k=out] .orb{background:rgba(181,96,46,.1);}
.ov[data-k=hold] .orb{background:rgba(181,96,46,.38);}
.ov[data-k=rest] .orb{background:rgba(139,143,146,.14);border-color:var(--muted);}
.ov[data-k=rest] .arc{stroke:var(--muted);}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rp{font-size:clamp(2.4rem,13vw,3.5rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;}
.rn{color:var(--muted);font-size:.92rem;margin-top:2px;padding:0 14%;}
.rs{color:var(--muted);font-size:.88rem;min-height:2.8em;margin:8px 0 14px;}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.ctl button{font:inherit;font-size:.95rem;border-radius:6px;padding:13px 22px;cursor:pointer;min-width:130px;border:1px solid var(--line);background:none;color:var(--text);}
.ctl .stop{border-color:var(--warn);color:var(--warn);}
.ctl .pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.ctl button[hidden]{display:none;}
@media (max-height:520px) and (orientation:landscape){
 .ov{padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));}
 .ovb{display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:center;text-align:left;max-width:760px;padding:0 50px;}
 .ring{grid-column:1;grid-row:1 / span 6;width:min(62vh,250px);margin:0;}
 .ot,.od,.opts,.rs,.nt,.ctl{grid-column:2;}
 .ot{padding:0;font-size:1.05rem;}
 .od{margin:4px 0 8px;font-size:.8rem;}
 .opts{justify-content:flex-start;}
 .rs{margin:6px 0 8px;min-height:0;}
 .ctl{justify-content:flex-start;}
 .ctl button{padding:11px 18px;min-width:110px;}
}
@media (max-height:340px) and (orientation:landscape){
 .ovb{column-gap:20px;}
 .ot{font-size:.95rem;}
 .od{font-size:.74rem;line-height:1.35;margin:2px 0 4px;}
 .opts{margin-bottom:2px;}
 .opts button{padding:5px 10px;font-size:.8rem;}
 .rs{margin:2px 0 6px;font-size:.8rem;}
 .nt{display:none;}
 .ctl{gap:8px;}
 .ctl button{padding:9px 14px;min-width:100px;font-size:.88rem;}
}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
<div class="eyebrow">ALTITUDE BREATH</div>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">EN</button><button type="button" data-l="hu">HU</button></div>
<h1 id="h1">8-Week Breathwork Program</h1>
<p id="hp">Breathing efficiency, CO₂ tolerance and composure under load. 15-20 min/day.</p>
</div></header>
<nav><div class="tabs" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="main"></main>
<footer id="ft">Breathwork supports acclimatization; it does not replace it. Climb high, sleep low.</footer>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="Exercise timer">
 <button class="sb" id="snd" aria-label="Toggle sound" title="Sound">♪</button>
 <button class="xb" id="ovx" aria-label="Close timer">✕</button>
 <div class="ovb">
  <div class="ot" id="ot"></div>
  <div class="od" id="od"></div>
  <div class="opts" id="oopts"></div>
  <div class="ring" id="ring">
   <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46" fill="none" stroke-width="1.6"/><circle class="arc" id="arc" cx="50" cy="50" r="46" fill="none" stroke-width="1.6"/></svg>
   <div class="orb" id="orb"></div>
   <div class="rt"><div class="rp" id="rp"></div><div class="rn" id="rn"></div></div>
  </div>
  <div class="rs" id="rs"></div><div class="nt" id="nt"></div><div class="sr" id="sr" aria-live="assertive"></div>
  <div class="ctl"><button class="pri" id="tb1"></button><button id="tb2"></button></div>
 </div>
</div>

<script>
var PH=[
{id:"p1",tab:"Wk 1-2",label:"WEEKS 1-2",title:"Foundation",focus:"Build the base pattern before adding stress.",
 items:[
 ["Resonance breathing","Daily · 10 min","Seated. Nose in 5 s, out 5 s (about 6 breaths/min). Breathe into the belly.","res"],
 ["Nasal-only easy movement","Daily · 20-30 min","Walk or easy Zone 2 ride. Mouth closed the whole time.","nasal"],
 ["Diaphragm check","3x/week · 5 min","Lying down, one hand on belly. The belly should rise before the chest.","diaph"]],
 why:"Slow nasal breathing trains the diaphragm and calms your baseline. Everything later builds on it."},
{id:"p2",tab:"Wk 3-5",label:"WEEKS 3-5",title:"Capacity",focus:"Strengthen the breathing muscles and raise CO₂ tolerance.",
 items:[
 ["Inspiratory muscle training","5x/week · 30 breaths","Resistance trainer at about 50% of max, or a level where the last 5 breaths feel hard. Do it after core sessions.","imt"],
 ["CO₂ tolerance table","2x/week · lying or floor-seated","8 rounds: comfortable hold after a normal exhale. Rest 2:00, dropping 15 s each round to 0:15. Stop at the first strong urge to breathe. Lie down or sit on the floor, away from hard objects.","co2"],
 ["Pursed-lip exhale drills","3x/week · 5 min","On stairs or hill repeats: inhale through the nose, exhale forcefully through pursed lips.","pursed"]],
 opt:["Optional: Wim Hof method, 1x/week"," in place of one CO₂ table. Lying down only: 3 rounds of 30 fast deep breaths, relaxed hold after an exhale, then one deep breath held 15 s. Never in water, standing, or while driving."],
 why:"Stronger inspiratory muscles delay breathing fatigue. CO₂ tolerance keeps you calm when air gets thin."},
{id:"p3",tab:"Wk 6-8",label:"WEEKS 6-8",title:"Integration",focus:"Bring the breathing into loaded movement.",
 items:[
 ["Loaded hike, step-breath rhythm","2x/week","With a pack. 2 steps in, 2 steps out, moving to 3:3 as it steepens. Keep a pace where this stays possible.","hike"],
 ["Pressure breathing on steep sections","During hikes","Inhale through the nose, exhale firmly through pursed lips.","","press"],
 ["Nasal-only Zone 2","1x/week · 45+ min","Builds breathing economy.","z2"],
 ["Inspiratory muscle training","3x/week · 30 breaths","Maintenance dose.","imt"],
 ["CO₂ tolerance table","1x/week · lying or floor-seated","Same format as weeks 3-5.","co2"]],
 why:"Matching breath to step rhythm keeps effort steady and stops you from gasping and burning out on long climbs."}
];

/* ---- timer definitions. A phase: n name, s seconds (null = open-ended, count-up),
   k kind (in/out/rest/hold/go), o orb scale, c big number override, q silent, hold = record hold time ---- */
function LVF(){var l=(typeof plan!=="undefined"&&plan&&plan.level)||0;return l<0?.75:l>0?1.25:1;}
function r5(x){return Math.round(x/5)*5;}
function pacer(a,b,n,q){var o=[],i,t;for(i=1;i<=n;i++){t=tf("Breath {0} / {1}",i,n);o.push({n:tx("Inhale"),s:a,k:"in",sub:t,q:q});o.push({n:tx("Exhale"),s:b,k:"out",sub:t,q:q});}return o;}
function cd(sec,name,sub){return [{n:name,s:sec,k:"go",sub:sub||""}];}

 res:{pace:1,make:function(){return pacer(5,5,Math.round(60*LVF()));}},

  var n=Math.round(8*LVF());for(i=0;i<n;i++){s=tf("Round {0} / {1}",i+1,n);

  return o;}},

  make:function(m){var t=tf("{0} steps in, {1} steps out",m,m);return [{n:tx("Inhale"),s:m,k:"in",sub:t},{n:tx("Exhale"),s:m,k:"out",sub:t}];}},

 sm_reset:{pace:1,scale:0,warn:" Symptoms mean descend: never use breathwork to push through them.",hint:"2 minutes. Stop moving if it's safe, drop your shoulders, then breathe.",make:function(){return pacer(3,5,15);}},
 sm_descent:{pace:1,loop:1,scale:0,warn:" Symptoms mean descend: never use breathwork to push through them.",hint:"Runs until you end it. Keep breathing steady while you focus on your footing.",

 bl_walk:{scale:0,hint:"10 minutes. Walk at an easy pace with your mouth closed, then rate how comfortable it felt.",make:function(){return cd(600,tx("Nasal-only walk"),tx("Mouth closed"));}},
 bl_hold:{orb:1,scale:0,warn:" Lying down only. Never in water, standing or driving.",hint:"One relaxed hold after a normal exhale. Tap at the first strong urge.",make:function(){return [{n:tx("Hold"),s:null,k:"hold",o:.55,hold:1,btn:tx("First strong urge"),sub:tx("after a normal exhale")}];}},
 whm:{orb:1,hint:"3 rounds. Tap at the first urge to breathe.",warn:" Lying down only. Never in water, standing or driving.",make:function(){var o=[],r,i,s;
  for(r=1;r<=3;r++){s=tf("Round {0} / {1}",r,3);

   o.push({n:tx("Exhale & hold"),s:null,k:"hold",o:.55,hold:1,btn:tx("I need to breathe"),sub:s+" · "+tx("relaxed, after an exhale")});
   o.push({n:tx("Deep breath in & hold"),s:15,k:"hold",o:1,sub:s+" · "+tx("hold 15 s")});}

 res:{w:"Your diaphragm and the calming (parasympathetic) side of your nervous system. Around 6 breaths a minute is close to the rate where heart rate and breathing sync up best.",

  n:"Nasal breathing doesn't magically add oxygen. Its value is keeping you honest about pace."},
 diaph:{w:"Diaphragm awareness: whether your belly or your upper chest and neck do the work.",
  y:"Under stress many people breathe high and shallow, which is tiring. Lying down makes the right pattern easy to feel, so you can recognise and fix it when things get hard."},
 imt:{w:"The diaphragm and other muscles you breathe in with, loaded with a resistance trainer like a weight-room set for your lungs.",
  y:"Stronger breathing muscles tire later, so each breath costs less effort. Studies mostly show less perceived breathlessness; the performance gains are real but modest.",
  n:"Keep the resistance moderate and the form smooth. Stop if you get dizzy.",h:"Sit tall, breathe in firmly through the trainer and breathe out normally. If it shows a pressure reading or you've tested your max, aim for about 50%. With no gauge, use the lightest setting where the last 5 of the 30 breaths feel hard (about 6–7 out of 10) but your shoulders stay down and your breathing stays smooth. Go up one small step only after two sessions where 30 breaths felt easy."},
 co2:{w:"Your tolerance of the urge to breathe, which is driven by rising CO\u2082, and your ability to stay relaxed while it builds. The rests get shorter each round so CO\u2082 has less time to clear.",
  y:"Up high you breathe harder and feel breathless at the same effort. Practising calm in that sensation helps you avoid panic breathing and wasted energy.",
  n:"It trains your response to the sensation, not lung size. Lie down or sit on the floor away from hard objects (lying is best for your first sessions). Stop at the first strong urge and never push to the edge of blacking out."},
 pursed:{w:"Exhale control. Pursing your lips creates light back-pressure that slows the exhale and keeps the airways open.",

  ["Climb high, sleep low: a higher day hike followed by sleeping lower helps your body adjust.","Mássz magasra, aludj alacsonyan: egy magasabbra vezető napi túra, majd alvás lejjebb segíti a szervezet alkalmazkodását."],

  ["Drink enough, eat well and skip alcohol in the first days.","Igyál eleget, egyél jól, és az első napokon kerüld az alkoholt."]]},
 {t:["Know your plan","Ismerd a terved"],li:[

  ["Never go up to sleep higher while you have symptoms. If they get worse, descend. Never leave someone with symptoms alone.","Tünetekkel soha ne menj feljebb aludni. Ha romlanak, szállj le. Tüneteket mutató társadat soha ne hagyd egyedül."],

 var hu=LANG==="hu",h='<div class="top"><span class="label">'+tx("SUMMIT DAY")+'</span></div><h2 class="title">'+tx("Summit-day toolkit")+'</h2><p class="focus">'+tx("Quick tools for the mountain. Only slow, rhythmic breathing: no breath-holds, no fast breathing.")+'</p>'+

function closeT(){var op=R&&R.opener,dy=R&&R.day;if(R){cancelAnimationFrame(R.raf);recHolds();if(R.tid==="bl_hold"&&R.holds.length&&$("blHold"))$("blHold").value=Math.round(R.holds[0]);}audioStop();wl(false);ov.hidden=true;setInert(false);document.body.style.overflow="";var had=R;R=null;if(had&&had.hs)renderProgress();if(op&&document.contains(op)&&op.focus)op.focus();else if(dy){var nb=document.querySelector("#s0 .go");if(nb)nb.focus();}}
function sumT(ph){var t=0;for(var i=0;i<ph.length;i++){if(ph[i].s==null)return 0;t+=ph[i].s;}return t;}

function ui(){
 var T=R.T,s=R.state,p=R.phases&&R.phases[R.i],b1=$("tb1"),b2=$("tb2"),oo=$("oopts"),i;
 $("nt").textContent="";$("ot").textContent=R.title;$("od").textContent=R.desc+(T.warn?tx(T.warn):"");
 ov.classList.toggle("noorb",!(T.pace||T.orb));
 oo.textContent="";
 if(s==="prep"){
  if(R.opts)R.opts.forEach(function(m){var b=document.createElement("button");b.type="button";b.textContent=T.optFmt?T.optFmt(m):tf("{0} min",m);b.className=m===R.mins?"on":"";b.dataset.m=m;oo.appendChild(b);});
  var tot=T.loop?0:sumT(T.make(R.mins));
  ov.dataset.k="rest";$("rp").textContent=tot?fmt(tot):tx("Ready");$("rn").textContent=tot?tx("total"):"";
  $("rs").textContent=T.hint?tx(T.hint):tf("About {0} min. A 3-second lead-in starts first.",Math.round(tot/60));
  $("arc").style.strokeDashoffset=CIRC;
  b1.textContent=tx("Start");b2.hidden=true;if(preOK(T))$("nt").textContent=tx("Tip: you can lock your phone. The sound cues keep playing on most phones.");
 }else if(s==="end"){
  ov.dataset.k="go";$("rp").textContent=tx("Done");$("rn").textContent="";
  var msg=R.holds.length?tx("Holds:")+" "+R.holds.map(function(h){return fmt(Math.round(h));}).join(" · "):"";
  $("rs").textContent=(msg?msg+"\n":"")+(R.key?tx("Marked as done."):tx("Nice work."));$("rs").style.whiteSpace="pre-line";
  b1.textContent=tx("Close");b2.hidden=true;
 }else{
  $("rs").style.whiteSpace="";ov.dataset.k=p.k;$("rn").textContent=p.n;
  if(s==="pause"){b1.textContent=tx("Resume");b2.textContent=tx("Stop");b2.hidden=false;}
  else if(p.k==="hold"){b1.textContent=p.s==null?(p.btn||tx("Next")):tx("Skip");b2.textContent=tx("End session");b2.hidden=false;}
  else if(p.s==null){b1.textContent=p.btn||tx("Next");b2.textContent=tx("Pause");b2.hidden=false;}
  else{b1.textContent=tx("Pause");if(R.T.loop){b2.textContent=tx("End session");b2.hidden=false;}else{b2.textContent=tx("Skip");b2.hidden=p.k!=="rest"||!!R.pre;}}
  b2.className=(s==="run"&&p.k==="hold")?"stop":"";
  if(s==="run")draw(now(),p);
 }
}
function setOrb(p,rem){
 var sc=p.o!=null?p.o:(p.k==="in"?1:p.k==="out"?.55:null);if(sc==null)return;
 var br=p.k==="in"||p.k==="out",o=$("orb");
 o.style.transition="transform "+(br&&rem?rem:1)+"s "+(br?"ease-in-out":"ease");o.style.transform="scale("+sc+")";
}
function begin(rem,silent){var p=R.phases[R.i];ov.dataset.k=p.k;setOrb(p,rem);if(!silent){cue(p);announce(p);}R.tk=0;}
function start(){
 R.phases=R.T.make(R.mins);R.phases.unshift({n:tx("Get ready"),gr:1,s:3,k:"rest",q:1,o:.55,sub:"",c:3});
 R.tot=R.T.loop?0:sumT(R.phases);R.i=0;R.dT=0;R.st=now();R.state="run";R.lt=R.ls=null;
 var o=$("orb");o.style.transition="none";o.style.transform="scale(.55)";void o.offsetWidth;
 wl(true);audioStart();begin(R.phases[0].s,true);ui();R.raf=requestAnimationFrame(tick);
}
function draw(t,p){
 var e=t-R.st,rem=p.s!=null?p.s-e:0,txt;
 if(p.s==null)txt=fmt(Math.floor(e));
 else if(p.c!=null&&!p.gr)txt=String(p.c);
 else if(R.T.pace||p.gr)txt=String(Math.max(1,Math.ceil(rem)));
 else txt=fmt(rem);
 if(txt!==R.lt){$("rp").textContent=txt;R.lt=txt;}
 var prog=R.tot?(R.dT+e)/R.tot:(p.s!=null?e/p.s:1);
 $("arc").style.strokeDashoffset=CIRC*(1-Math.min(1,Math.max(0,prog)));
 var sub=p.sub||"";if(R.tot&&!p.gr)sub+=(sub?" · ":"")+tf("{0} left",fmt(R.tot-R.dT-e));
 if(sub!==R.ls){$("rs").textContent=sub;R.ls=sub;}
 if(p.k==="rest"&&p.s>4&&rem<=3){var c=Math.ceil(rem);if(c!==R.tk&&c>0){R.tk=c;tone(880,.09,.12);}}
}
function tick(){
 if(!R||R.state!=="run")return;
 var t=now(),p=R.phases[R.i],ch=false;
 while(p.s!=null&&t>=R.st+p.s){R.st+=p.s;R.dT+=p.s;R.i++;if(R.i>=R.phases.length){if(R.T.loop)R.i=1;else{finish();return;}}p=R.phases[R.i];ch=true;}
 if(ch){ui();begin(p.s!=null?Math.max(.1,R.st+p.s-t):null);}
 if(R.pre&&R.T.loop&&!R.go&&R.i>=1){R.go=1;R.t0=R.st;if(AUD){try{AUD.currentTime=Math.max(0,t-R.st)%R.cyc;}catch(e){}AUD.muted=!snd;}}
 draw(t,p);R.raf=requestAnimationFrame(tick);
}
function next(){ /* end an open-ended phase */
 var t=now(),p=R.phases[R.i];if(p.hold)R.holds.push(t-R.st);
 R.i++;R.st=t;if(R.i>=R.phases.length){finish();return;}
 R.lt=R.ls=null;ui();begin(R.phases[R.i].s);
}
function skip(){var t=now(),p=R.phases[R.i];R.tot-=Math.max(0,p.s-(t-R.st));R.i++;R.st=t;R.lt=R.ls=null;ui();begin(R.phases[R.i].s);}
function pause(){
 R.pa=now();cancelAnimationFrame(R.raf);R.state="pause";if(R.pre&&AUD)AUD.pause();say(tx("Pause"));
 var o=$("orb"),tr=getComputedStyle(o).transform;o.style.transition="none";o.style.transform=tr;wl(false);ui();
}
function resume(){
 var t=now(),p;R.st+=t-R.pa;if(R.t0!=null)R.t0+=t-R.pa;R.state="run";p=R.phases[R.i];
 begin(p.s!=null?Math.max(.1,R.st+p.s-t):null,true);wl(true);ui();R.raf=requestAnimationFrame(tick);if(R.pre&&AUD){syncAudio();var pr=AUD.play();if(pr&&pr.catch)pr.catch(function(){});}
}
function finish(){
 cancelAnimationFrame(R.raf);R.state="end";wl(false);
 if(R.key){store[R.key]=true;save();var tr=document.querySelector('tr[data-k="'+R.key+'"]');if(tr){tr.classList.add("done");tr.querySelector("input").checked=true;}badges();}
 recHolds();
 var dk=R.day||(R.key?todayStr()+"|"+R.key:null);if(dk){log[dk]=1;saveLog();renderToday();}renderProgress();
 chime();say(tx("Done"));ui();$("arc").style.strokeDashoffset=0;setOrb({k:"go",o:.8},1);
}
function act(w){
 var s=R.state,p=R.phases&&R.phases[R.i];
 if(s==="prep")start();
 else if(s==="end")closeT();
 else if(s==="pause"){if(w===1)resume();else closeT();}
 else if(p.k==="hold"){if(w===2)closeT();else if(p.s==null)next();else skip();}
 else if(p.s==null){if(w===1)next();else pause();}
 else{if(w===1)pause();else if(R.T.loop)closeT();else skip();}
}
$("tb1").addEventListener("click",function(){if(R)act(1);});
$("tb2").addEventListener("click",function(){if(R)act(2);});
$("ovx").addEventListener("click",closeT);
$("snd").addEventListener("click",function(){snd=!snd;try{localStorage.setItem("ab_snd",snd?"1":"0");}catch(e){}paintSnd();if(R&&R.pre&&AUD)AUD.muted=!snd||(R.T.loop&&!R.go);if(R&&R.state==="prep")ui();if(snd)tone(523,.2);});
$("oopts").addEventListener("click",function(e){var b=e.target.closest("button");if(b&&R&&R.state==="prep"){R.mins=+b.dataset.m;ui();}});
document.addEventListener("keydown",function(e){
 if(!R)return;
 if(e.key==="Tab"){var f=[].filter.call(ov.querySelectorAll("button"),function(b){return !b.hidden&&b.offsetParent!==null;});
  if(f.length){var a=document.activeElement,fi=f[0],la=f[f.length-1];
   if(e.shiftKey&&(a===fi||!ov.contains(a))){e.preventDefault();la.focus();}
   else if(!e.shiftKey&&(a===la||!ov.contains(a))){e.preventDefault();fi.focus();}}
  return;}
 if(e.key==="Escape")closeT();
 else if(e.code==="Space"&&e.target.tagName!=="BUTTON"){e.preventDefault();if(R.state==="run"){var cp=R.phases[R.i];if(!(cp&&cp.k==="hold"))pause();}else if(R.state==="pause")resume();else if(R.state==="prep")start();}
});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
